# ---MLP DSAC Networks---
# Same actor as SAC, distributional Q-network for critics

actor_network:
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256, 256, 256]
    use_layer_norm: False
    activation: silu
  action_head:
    _target_: stoix.networks.heads.NormalAffineTanhDistributionHead

q_network:
  input_layer:
    _target_: stoix.networks.inputs.EmbeddingActionInput
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256, 256, 256]
    use_layer_norm: True
    activation: silu
  critic_head:
    _target_: stoix.networks.heads.QuantileContinuousQNetwork
    num_quantiles: ${system.num_quantiles}
