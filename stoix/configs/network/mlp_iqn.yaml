# ---MLP IQN Networks---
actor_network:
  pre_torso:
    _target_: stoix.networks.torso.MLPTorso
    layer_sizes: [256, 256]
    use_layer_norm: False
    activation: silu
  action_head:
    _target_: stoix.networks.heads.ImplicitQuantileDiscreteQNetwork
    num_tau_samples: ${system.num_tau_samples}
    num_cosines: ${system.num_cosines}
    embedding_dim: ${system.embedding_dim}
